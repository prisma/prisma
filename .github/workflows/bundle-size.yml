name: Bundle Size

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect inert diff
    runs-on: ubuntu-latest
    outputs:
      inert: ${{ steps.detect.outputs.inert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-inert-diff

  size:
    name: Size Limit
    needs: changes
    if: needs.changes.outputs.inert != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build size fixtures
        working-directory: examples/bundle-size
        run: pnpm size:build
      - name: Check size limits
        working-directory: examples/bundle-size
        run: pnpm exec size-limit --json > size-limit-results.json
      - name: Save size results
        if: always() && hashFiles('examples/bundle-size/size-limit-results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-limit-results
          path: examples/bundle-size/size-limit-results.json
          retention-days: 7
