name: Preview Release

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    tags:
      - "!**"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Skip the whole preview build+publish on inert (docs-only) PRs — there is no
  # publishable package change to preview. "Publish preview" is not a required
  # status check, so skipping the job does not wedge the merge ruleset. On
  # push-to-main the detector reports non-inert, so previews still publish.
  changes:
    name: Detect inert diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      inert: ${{ steps.detect.outputs.inert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-inert-diff

  preview:
    name: Publish preview
    needs: changes
    if: needs.changes.outputs.inert != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish to pkg.pr.new
        run: |
          PACKAGES=$(node scripts/list-publishable-packages.mjs)
          PACKAGE_PATTERN='\./packages/([a-zA-Z0-9_@-]+/)*[a-zA-Z0-9_@-]+'
          if [[ ! "$PACKAGES" =~ ^${PACKAGE_PATTERN}(\ ${PACKAGE_PATTERN})*$ ]]; then
            printf '%s\n' 'Invalid publishable package list' >&2
            exit 1
          fi
          read -r -a package_paths <<< "$PACKAGES"
          pnpm exec pkg-pr-new publish --pnpm --comment=off --json preview-packages.json "${package_paths[@]}"

      - name: Save preview package URLs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-packages
          path: preview-packages.json
          if-no-files-found: error
          retention-days: 7
